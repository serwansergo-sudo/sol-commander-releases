name: SOL Windows Stable Installer Smoke

on:
  push:
    paths:
      - .github/workflows/sol-windows-install-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-install-smoke:
    name: Stable v0.1.6 / clean isolated Windows acceptance
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download existing draft asset (read-only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v0.1.6 -R $env:GITHUB_REPOSITORY --pattern 'SOL-Commander-Setup-v0.1.6.exe' --dir .
          if ($LASTEXITCODE -ne 0) { throw "STABLE_ASSET_DOWNLOAD_FAILED" }
          if (!(Test-Path '.\SOL-Commander-Setup-v0.1.6.exe')) { throw "STABLE_ASSET_NOT_FOUND" }
          $actual = (Get-FileHash '.\SOL-Commander-Setup-v0.1.6.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '4852f8eacb847e2ab756cf882a6c95ee74b2596059579e20ae434dd4aedb92d4'
          if ($actual -ne $expected) { throw "UNREVIEWED_STABLE_ASSET: hash differs from checked version" }
          Write-Output "STABLE_ASSET_SHA256_VERIFIED=$actual"

      - name: Self-test then install into disposable acceptance directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'SOL-Commander-Setup-v0.1.6.exe'
          $root = Join-Path $env:RUNNER_TEMP 'SOL Commander isolated acceptance'
          & $setup --self-test
          if ($LASTEXITCODE -ne 0) { throw "SETUP_SELF_TEST_FAILED" }
          & $setup --quiet --acceptance --install-root $root
          if ($LASTEXITCODE -ne 0) { throw "CLEAN_INSTALL_FAILED" }
          $agent = Join-Path $root 'app\0.1.6\agent\dist\main.js'
          $node = Join-Path $root 'app\0.1.6\runtime\node.exe'
          if (!(Test-Path -LiteralPath $agent)) { throw "AGENT_ENTRYPOINT_MISSING" }
          if (!(Test-Path -LiteralPath $node)) { throw "NODE_RUNTIME_MISSING" }
          & $setup --uninstall --quiet --acceptance --install-root $root
          if ($LASTEXITCODE -ne 0) { throw "ISOLATED_UNINSTALL_FAILED" }
          if (Test-Path -LiteralPath (Join-Path $root 'app')) { throw "INSTALL_FILES_REMAIN_AFTER_UNINSTALL" }
          Write-Output 'STABLE_WINDOWS_INSTALL_SMOKE_PASS'

      - name: Result scope
        shell: pwsh
        run: |
          Write-Output 'This smoke tests the pinned published stable GitHub v0.1.6 only.'
          Write-Output 'It does NOT approve the newer v0.1.7 local build, 57 tools, OAuth, or plugin publication.'
