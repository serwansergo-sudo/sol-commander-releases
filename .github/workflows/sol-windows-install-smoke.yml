name: SOL Windows Stable Installer Smoke

on:
  push:
    paths:
      - .github/workflows/sol-windows-install-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-install-smoke:
    name: Stable v0.1.6 / clean isolated Windows acceptance
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download published stable asset (read-only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v0.1.6 -R $env:GITHUB_REPOSITORY --pattern 'SOL-Commander-Setup-v0.1.6.exe' --dir .
          if ($LASTEXITCODE -ne 0) { throw "STABLE_ASSET_DOWNLOAD_FAILED" }
          if (!(Test-Path '.\SOL-Commander-Setup-v0.1.6.exe')) { throw "STABLE_ASSET_NOT_FOUND" }
          $actual = (Get-FileHash '.\SOL-Commander-Setup-v0.1.6.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '4852f8eacb847e2ab756cf882a6c95ee74b2596059579e20ae434dd4aedb92d4'
          if ($actual -ne $expected) { throw "UNREVIEWED_STABLE_ASSET: hash differs from checked version" }
          Write-Output "STABLE_ASSET_SHA256_VERIFIED=$actual"

      - name: Self-test then install into disposable acceptance directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'SOL-Commander-Setup-v0.1.6.exe'
          $root = Join-Path $env:RUNNER_TEMP 'SOL Commander isolated acceptance'
          $selfTest = Start-Process -FilePath $setup -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "SETUP_SELF_TEST_FAILED exit=$($selfTest.ExitCode)" }
          $install = Start-Process -FilePath $setup -ArgumentList @('--quiet', '--acceptance', '--install-root', ('"' + $root + '"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "CLEAN_INSTALL_FAILED exit=$($install.ExitCode)" }
          $agent = Join-Path $root 'app\0.1.6\agent\dist\main.js'
          $node = Join-Path $root 'app\0.1.6\runtime\node.exe'
          if (!(Test-Path -LiteralPath $agent)) { throw "AGENT_ENTRYPOINT_MISSING" }
          if (!(Test-Path -LiteralPath $node)) { throw "NODE_RUNTIME_MISSING" }
          $uninstall = Start-Process -FilePath $setup -ArgumentList @('--uninstall', '--quiet', '--acceptance', '--install-root', ('"' + $root + '"')) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "ISOLATED_UNINSTALL_FAILED exit=$($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $root 'app')) { throw "INSTALL_FILES_REMAIN_AFTER_UNINSTALL" }
          Write-Output 'STABLE_WINDOWS_INSTALL_SMOKE_PASS'

      - name: Result scope
        shell: pwsh
        run: |
          Write-Output 'This smoke tests the pinned published stable GitHub v0.1.6 only.'
          Write-Output 'It does NOT approve the newer v0.1.7 local build, 57 tools, OAuth, or plugin publication.'


  draft-install-smoke:
    name: Existing v0.1.7 draft / isolated Windows acceptance (older candidate)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Read draft asset by exact authorized GitHub asset ID
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'SOL-Commander-Setup-v0.1.7.exe'
          $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/711147388"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'SOL-Commander-Windows-Release-Smoke'
          }
          Invoke-WebRequest -Uri $url -Headers $headers -OutFile $setup
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '968dff018a8d8ac49b7eed9be2e32b74e5c55c03ecf5bbb0fb518394df5cffff'
          if ($actual -ne $expected) { throw "DRAFT_BINARY_NOT_PINNED: downloaded bytes differ" }
          Write-Output "DRAFT_OLD_CANDIDATE_SHA256_VERIFIED=$actual"

      - name: Isolated self-test, clean install and uninstall of old draft
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'SOL-Commander-Setup-v0.1.7.exe'
          $root = Join-Path $env:RUNNER_TEMP 'SOL Commander draft acceptance'
          $selfTest = Start-Process -FilePath $setup -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "DRAFT_SELF_TEST_FAILED exit=$($selfTest.ExitCode)" }
          $install = Start-Process -FilePath $setup -ArgumentList @('--quiet','--acceptance','--install-root', ('"' + $root + '"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "DRAFT_INSTALL_FAILED exit=$($install.ExitCode)" }
          $agent = Join-Path $root 'app\0.1.7\agent\dist\main.js'
          $node = Join-Path $root 'app\0.1.7\runtime\node.exe'
          if (!(Test-Path -LiteralPath $agent)) { throw 'DRAFT_AGENT_MISSING' }
          if (!(Test-Path -LiteralPath $node)) { throw 'DRAFT_RUNTIME_MISSING' }
          $uninstall = Start-Process -FilePath $setup -ArgumentList @('--uninstall','--quiet','--acceptance','--install-root', ('"' + $root + '"')) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "DRAFT_UNINSTALL_FAILED exit=$($uninstall.ExitCode)" }
          if (Test-Path (Join-Path $root 'app')) { throw 'DRAFT_INSTALL_FILES_REMAIN' }
          Write-Output 'OLDER_V017_DRAFT_WINDOWS_SMOKE_PASS'
          Write-Output 'IMPORTANT: THIS DOES NOT VERIFY THE NEWER LOCAL v0.1.7 HASH OR PUBLIC READINESS'
