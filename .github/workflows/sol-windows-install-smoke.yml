name: SOL Windows Stable Installer Smoke

on:
  push:
    paths:
      - .github/workflows/sol-windows-install-smoke.yml
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  stable-install-smoke:
    if: github.event_name != 'release'
    name: Stable v0.1.6 / clean isolated Windows acceptance
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download published stable asset (read-only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v0.1.6 -R $env:GITHUB_REPOSITORY --pattern 'SOL-Commander-Setup-v0.1.6.exe' --dir .
          if ($LASTEXITCODE -ne 0) { throw "STABLE_ASSET_DOWNLOAD_FAILED" }
          if (!(Test-Path '.\SOL-Commander-Setup-v0.1.6.exe')) { throw "STABLE_ASSET_NOT_FOUND" }
          $actual = (Get-FileHash '.\SOL-Commander-Setup-v0.1.6.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '4852f8eacb847e2ab756cf882a6c95ee74b2596059579e20ae434dd4aedb92d4'
          if ($actual -ne $expected) { throw "UNREVIEWED_STABLE_ASSET: hash differs from checked version" }
          Write-Output "STABLE_ASSET_SHA256_VERIFIED=$actual"

      - name: Self-test then install into disposable acceptance directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'SOL-Commander-Setup-v0.1.6.exe'
          $root = Join-Path $env:RUNNER_TEMP 'SOL Commander isolated acceptance'
          $selfTest = Start-Process -FilePath $setup -ArgumentList '--self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) { throw "SETUP_SELF_TEST_FAILED exit=$($selfTest.ExitCode)" }
          $install = Start-Process -FilePath $setup -ArgumentList @('--quiet', '--acceptance', '--install-root', ('"' + $root + '"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "CLEAN_INSTALL_FAILED exit=$($install.ExitCode)" }
          $agent = Join-Path $root 'app\0.1.6\agent\dist\main.js'
          $node = Join-Path $root 'app\0.1.6\runtime\node.exe'
          if (!(Test-Path -LiteralPath $agent)) { throw "AGENT_ENTRYPOINT_MISSING" }
          if (!(Test-Path -LiteralPath $node)) { throw "NODE_RUNTIME_MISSING" }
          $uninstall = Start-Process -FilePath $setup -ArgumentList @('--uninstall', '--quiet', '--acceptance', '--install-root', ('"' + $root + '"')) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "ISOLATED_UNINSTALL_FAILED exit=$($uninstall.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $root 'app')) { throw "INSTALL_FILES_REMAIN_AFTER_UNINSTALL" }
          Write-Output 'STABLE_WINDOWS_INSTALL_SMOKE_PASS'

      - name: Result scope
        shell: pwsh
        run: |
          Write-Output 'This smoke tests the pinned published stable GitHub v0.1.6 only.'
          Write-Output 'This does NOT approve candidate releases, 57 tools, OAuth, or plugin publication.'

  beta-candidate-acceptance:
    if: github.event_name == 'release' && github.event.release.prerelease == true && github.event.release.tag_name == 'v0.1.7'
    name: Exact v0.1.7 beta EXE / isolated clean-install, upgrade and uninstall
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Download and pin beta and stable installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path beta, stable | Out-Null
          gh release download v0.1.7 -R $env:GITHUB_REPOSITORY --pattern 'SOL-Commander-Setup-v0.1.7.exe' --dir beta
          if ($LASTEXITCODE -ne 0) { throw 'BETA_DOWNLOAD_FAILED' }
          gh release download v0.1.6 -R $env:GITHUB_REPOSITORY --pattern 'SOL-Commander-Setup-v0.1.6.exe' --dir stable
          if ($LASTEXITCODE -ne 0) { throw 'STABLE_DOWNLOAD_FAILED' }
          $bh = (Get-FileHash 'beta\SOL-Commander-Setup-v0.1.7.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $sh = (Get-FileHash 'stable\SOL-Commander-Setup-v0.1.6.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bh -ne '16c3f87a09a6d7f39dbe717e648f76fc275a4f62856d61e9b02ef844a9364bba') { throw 'BETA_SHA256_MISMATCH' }
          if ($sh -ne '4852f8eacb847e2ab756cf882a6c95ee74b2596059579e20ae434dd4aedb92d4') { throw 'STABLE_SHA256_MISMATCH' }
          Write-Output "BETA_SHA256_VERIFIED=$bh"
      - name: Clean-install and uninstall exact beta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'beta\SOL-Commander-Setup-v0.1.7.exe'
          $root = Join-Path $env:RUNNER_TEMP 'SOL Commander beta clean install'
          $t = Start-Process $setup -ArgumentList '--self-test' -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "SELF_TEST_FAILED=$($t.ExitCode)" }
          $i = Start-Process $setup -ArgumentList @('--quiet','--acceptance','--install-root',('"' + $root + '"')) -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "BETA_INSTALL_FAILED=$($i.ExitCode)" }
          if (!(Test-Path (Join-Path $root 'app\0.1.7\agent\dist\main.js'))) { throw 'BETA_AGENT_MISSING' }
          if (!(Test-Path (Join-Path $root 'app\0.1.7\runtime\node.exe'))) { throw 'BETA_RUNTIME_MISSING' }
          $runtime = Get-Content (Join-Path $root 'runtime.json') -Raw | ConvertFrom-Json
          if ($runtime.version -ne '0.1.7') { throw 'BETA_VERSION_MISMATCH' }
          $u = Start-Process $setup -ArgumentList @('--uninstall','--quiet','--acceptance','--install-root',('"' + $root + '"')) -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "BETA_UNINSTALL_FAILED=$($u.ExitCode)" }
          if (Test-Path (Join-Path $root 'app')) { throw 'BETA_RUNTIME_NOT_REMOVED' }
          Write-Output 'CLEAN_BETA_INSTALL_UNINSTALL_PASS'
      - name: Upgrade from stable preserving local user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'SOL Commander beta upgrade'
          $stable = Join-Path $PWD 'stable\SOL-Commander-Setup-v0.1.6.exe'
          $beta = Join-Path $PWD 'beta\SOL-Commander-Setup-v0.1.7.exe'
          $args = @('--quiet','--acceptance','--install-root',('"' + $root + '"'))
          $i = Start-Process $stable -ArgumentList $args -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "STABLE_INSTALL_FAILED=$($i.ExitCode)" }
          $data = Join-Path $root 'data'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $fixture = Join-Path $data 'preserve-fixture.txt'
          [IO.File]::WriteAllText($fixture,'SYNTHETIC-DATA-ONLY')
          $u = Start-Process $beta -ArgumentList $args -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "BETA_UPGRADE_FAILED=$($u.ExitCode)" }
          $runtime = Get-Content (Join-Path $root 'runtime.json') -Raw | ConvertFrom-Json
          if ($runtime.version -ne '0.1.7') { throw 'UPGRADE_NOT_ACTIVE' }
          if ((Get-Content $fixture -Raw) -ne 'SYNTHETIC-DATA-ONLY') { throw 'USER_DATA_CHANGED' }
          $remove = Start-Process $beta -ArgumentList @('--uninstall','--quiet','--acceptance','--install-root',('"' + $root + '"')) -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "UPGRADE_UNINSTALL_FAILED=$($remove.ExitCode)" }
          if (!(Test-Path $fixture)) { throw 'UNINSTALL_DELETED_DATA' }
          if (Test-Path (Join-Path $root 'app')) { throw 'UNINSTALL_LEFT_RUNTIME' }
          Write-Output 'BETA_UPGRADE_AND_USER_DATA_PRESERVATION_PASS'
      - name: Clarify test scope
        shell: pwsh
        run: |
          Write-Output 'Tested the pinned beta EXE on disposable Windows, not the owner PC.'
          Write-Output 'Not a certificate, auto-update, 57 tools, OAuth or OpenAI publication validation.'

  beta-018-acceptance:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == true && github.event.release.tag_name == 'v0.1.8')
    name: Exact v0.1.8 candidate - SHA-pinned Windows install and v0.1.6 upgrade
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Download and pin beta and stable installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path beta, stable | Out-Null
          gh release download v0.1.8 -R $env:GITHUB_REPOSITORY --pattern 'SOL-Commander-Setup-v0.1.8.exe' --dir beta
          if ($LASTEXITCODE -ne 0) { throw 'BETA_DOWNLOAD_FAILED' }
          gh release download v0.1.6 -R $env:GITHUB_REPOSITORY --pattern 'SOL-Commander-Setup-v0.1.6.exe' --dir stable
          if ($LASTEXITCODE -ne 0) { throw 'STABLE_DOWNLOAD_FAILED' }
          $bh = (Get-FileHash 'beta\SOL-Commander-Setup-v0.1.8.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $sh = (Get-FileHash 'stable\SOL-Commander-Setup-v0.1.6.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bh -ne '93cd3ed77b03c7370b346e031d8cb187690544b5c876bdc54de94d70b6b22a6e') { throw 'BETA_SHA256_MISMATCH' }
          if ($sh -ne '4852f8eacb847e2ab756cf882a6c95ee74b2596059579e20ae434dd4aedb92d4') { throw 'STABLE_SHA256_MISMATCH' }
          Write-Output "BETA_SHA256_VERIFIED=$bh"
      - name: Clean-install and uninstall exact beta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'beta\SOL-Commander-Setup-v0.1.8.exe'
          $root = Join-Path $env:RUNNER_TEMP 'SOL Commander beta clean install'
          $t = Start-Process $setup -ArgumentList '--self-test' -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "SELF_TEST_FAILED=$($t.ExitCode)" }
          $i = Start-Process $setup -ArgumentList @('--quiet','--acceptance','--install-root',('"' + $root + '"')) -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "BETA_INSTALL_FAILED=$($i.ExitCode)" }
          if (!(Test-Path (Join-Path $root 'app\0.1.8\agent\dist\main.js'))) { throw 'BETA_AGENT_MISSING' }
          if (!(Test-Path (Join-Path $root 'app\0.1.8\runtime\node.exe'))) { throw 'BETA_RUNTIME_MISSING' }
          $runtime = Get-Content (Join-Path $root 'runtime.json') -Raw | ConvertFrom-Json
          if ($runtime.version -ne '0.1.8') { throw 'BETA_VERSION_MISMATCH' }
          $u = Start-Process $setup -ArgumentList @('--uninstall','--quiet','--acceptance','--install-root',('"' + $root + '"')) -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "BETA_UNINSTALL_FAILED=$($u.ExitCode)" }
          if (Test-Path (Join-Path $root 'app')) { throw 'BETA_RUNTIME_NOT_REMOVED' }
          Write-Output 'CLEAN_BETA_INSTALL_UNINSTALL_PASS'
      - name: Upgrade from stable preserving local user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'SOL Commander beta upgrade'
          $stable = Join-Path $PWD 'stable\SOL-Commander-Setup-v0.1.6.exe'
          $beta = Join-Path $PWD 'beta\SOL-Commander-Setup-v0.1.8.exe'
          $args = @('--quiet','--acceptance','--install-root',('"' + $root + '"'))
          $i = Start-Process $stable -ArgumentList $args -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "STABLE_INSTALL_FAILED=$($i.ExitCode)" }
          $data = Join-Path $root 'data'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $fixture = Join-Path $data 'preserve-fixture.txt'
          [IO.File]::WriteAllText($fixture,'SYNTHETIC-DATA-ONLY')
          $u = Start-Process $beta -ArgumentList $args -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "BETA_UPGRADE_FAILED=$($u.ExitCode)" }
          $runtime = Get-Content (Join-Path $root 'runtime.json') -Raw | ConvertFrom-Json
          if ($runtime.version -ne '0.1.8') { throw 'UPGRADE_NOT_ACTIVE' }
          if ((Get-Content $fixture -Raw) -ne 'SYNTHETIC-DATA-ONLY') { throw 'USER_DATA_CHANGED' }
          $remove = Start-Process $beta -ArgumentList @('--uninstall','--quiet','--acceptance','--install-root',('"' + $root + '"')) -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "UPGRADE_UNINSTALL_FAILED=$($remove.ExitCode)" }
          if (!(Test-Path $fixture)) { throw 'UNINSTALL_DELETED_DATA' }
          if (Test-Path (Join-Path $root 'app')) { throw 'UNINSTALL_LEFT_RUNTIME' }
          Write-Output 'BETA_UPGRADE_AND_USER_DATA_PRESERVATION_PASS'
      - name: Clarify test scope
        shell: pwsh
        run: |
          Write-Output 'Tested the pinned beta EXE on disposable Windows, not the owner PC.'
          Write-Output 'Not a certificate, auto-update, 57 tools, OAuth or OpenAI publication validation.'

  beta-018-archive-integrity:
    if: github.event_name == 'workflow_dispatch'
    name: Published v0.1.8 ZIP integrity and runtime license inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Download published immutable ZIP (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.1.8 -R "$GITHUB_REPOSITORY" --pattern 'sol-commander-agent-windows-v0.1.8.zip' --dir .
          echo '6005ba47f53bddbb5cdfad566f1460ebce442e7f53cbc04f76e7e237c601674c  sol-commander-agent-windows-v0.1.8.zip' | sha256sum --check -
          mkdir unpacked
          unzip -qq sol-commander-agent-windows-v0.1.8.zip -d unpacked
          test -f unpacked/SHA256SUMS.txt
          (cd unpacked && sha256sum --check SHA256SUMS.txt >/dev/null)
          echo "PUBLISHED_BETA_V018_ZIP_AND_ALL_INTERNAL_FILES_SHA256_PASS"

      - name: Inventory actual shipped third-party code and notices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          root=pathlib.Path('unpacked')
          assert (root/'manifest.json').exists(), 'PUBLIC_MANIFEST_MISSING'
          assert json.loads((root/'manifest.json').read_text()).get('version')=='0.1.8', 'PUBLIC_MANIFEST_WRONG_VERSION'
          required=[
            'runtime/node.exe',
            'agent/dist/main.js',
            'agent/vendor/chrome-devtools-mcp/LICENSE',
            'agent/vendor-runtime/firefox/LICENSE-MIT',
            'agent/vendor-runtime/firefox/LICENSE-APACHE',
            'agent/vendor-runtime/bin/geckodriver.exe',
            'THIRD_PARTY_NOTICES.md'
          ]
          for name in required:
              assert (root/name).is_file(), f'PACKAGED_NOTICE_OR_RUNTIME_MISSING:{name}'
          node_modules=root/'agent/vendor-runtime/node_modules'
          assert node_modules.is_dir(), 'STAGED_NPM_RUNTIME_MISSING'
          modules=[]
          for pkg in node_modules.iterdir():
              if not pkg.is_dir(): continue
              if pkg.name.startswith('@'):
                  modules += [sub for sub in pkg.iterdir() if sub.is_dir()]
              else:
                  modules.append(pkg)
          packages=[]
          for folder in modules:
              pj=folder/'package.json'
              if not pj.is_file(): continue
              p=json.loads(pj.read_text(encoding='utf-8'))
              license_value=p.get('license')
              assert isinstance(license_value,str) and license_value.strip(), f'LICENSE_METADATA_ABSENT:{p.get("name")}'
              notices=[x.name for x in folder.iterdir() if x.is_file() and re.match(r'^(LICENSE|LICENCE|NOTICE|COPYING)(\b|[-_.])',x.name,re.I)]
              packages.append((p.get('name'),p.get('version'),license_value,notices))
          assert len(packages)>=20, 'SUSPICIOUSLY_SMALL_DEPENDENCY_INVENTORY'
          jszip=[p for p in packages if p[0]=='jszip']
          assert len(jszip)==1 and jszip[0][1]=='3.10.2', 'JSZIP_VERSION_MISMATCH'
          assert any(x.upper().startswith('LICENSE') for x in jszip[0][3]), 'JSZIP_CHOICE_LICENSE_FILE_MISSING'
          missing_notices=[p[0] for p in packages if not p[3]]
          print('PUBLISHED_BETA_V018_RUNTIME_LICENSE_METADATA_PASS',len(packages),'packages')
          print('THIRD_PARTY_PACKAGE_WITHOUT_OWN_LICENSE_NOTICE_COUNT',len(missing_notices))
          print('NOTICE_REVIEW_REQUIRED_EXAMPLES',missing_notices[:15])
          print('LIMITATION: binary Node.js and geckodriver rights, first-party IP, signed publisher attestations are NOT legally certified')
          PY

  beta-019-acceptance:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == true && github.event.release.tag_name == 'v0.1.9')
    name: Published v0.1.9 beta - SHA-pinned Windows install and v0.1.6 upgrade
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Download and pin beta and stable installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path beta, stable | Out-Null
          gh release download v0.1.9 -R $env:GITHUB_REPOSITORY --pattern 'SOL-Commander-Setup-v0.1.9.exe' --dir beta
          if ($LASTEXITCODE -ne 0) { throw 'BETA_DOWNLOAD_FAILED' }
          gh release download v0.1.6 -R $env:GITHUB_REPOSITORY --pattern 'SOL-Commander-Setup-v0.1.6.exe' --dir stable
          if ($LASTEXITCODE -ne 0) { throw 'STABLE_DOWNLOAD_FAILED' }
          $bh = (Get-FileHash 'beta\SOL-Commander-Setup-v0.1.9.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $sh = (Get-FileHash 'stable\SOL-Commander-Setup-v0.1.6.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($bh -ne '219a968340cb34b5a2570b348f32ce630d2775f21d8c5548fdb245efb1312c9a') { throw 'BETA_SHA256_MISMATCH' }
          if ($sh -ne '4852f8eacb847e2ab756cf882a6c95ee74b2596059579e20ae434dd4aedb92d4') { throw 'STABLE_SHA256_MISMATCH' }
          Write-Output "BETA_SHA256_VERIFIED=$bh"
      - name: Validate published ZIP, all staged files and license notices
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v0.1.9 -R $env:GITHUB_REPOSITORY --pattern 'sol-commander-agent-windows-v0.1.9.zip' --dir beta
          if ($LASTEXITCODE -ne 0) { throw 'BETA_ZIP_DOWNLOAD_FAILED' }
          if ((Get-Item 'beta\sol-commander-agent-windows-v0.1.9.zip').Length -ne 49562418) { throw 'BETA_ZIP_SIZE_MISMATCH' }
          $hash=(Get-FileHash 'beta\sol-commander-agent-windows-v0.1.9.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '18e2c02cf5c25688449731d2486ff8eddd676b543c17113522add3b01be98c3e') { throw 'DRAFT_ZIP_SHA256_MISMATCH' }
          Expand-Archive -LiteralPath 'beta\sol-commander-agent-windows-v0.1.9.zip' -DestinationPath 'beta-unpacked'
          $base=Join-Path $PWD 'beta-unpacked'
          $checksums=Get-Content -LiteralPath (Join-Path $base 'SHA256SUMS.txt')
          $checked=0
          foreach($line in $checksums) {
            if($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'STAGE_CHECKSUM_FORMAT' }
            $expected=$Matches[1]
            $name=$Matches[2].Replace('/','\')
            if($name.StartsWith('\') -or $name.Split('\').Contains('..')) { throw 'CHECKSUM_PATH_TRAVERSAL' }
            $file=Join-Path $base $name
            if(!(Test-Path -LiteralPath $file -PathType Leaf)) { throw 'ZIP_MEMBER_MISSING' }
            $actual=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if($actual -ne $expected) { throw 'ZIP_MEMBER_SHA256_MISMATCH' }
            $checked++
          }
          $count=(Get-ChildItem -LiteralPath $base -File -Recurse | Measure-Object).Count
          if($checked -ne 1009 -or $count -ne 1010) { throw "ZIP_INVENTORY_MISMATCH checked=$checked actual=$count" }
          foreach($license in @(
            'agent\vendor-runtime\node_modules\isarray\LICENSE',
            'agent\vendor-runtime\node_modules\@bazel\runfiles\LICENSE',
            'agent\vendor\chrome-devtools-mcp\LICENSE',
            'THIRD_PARTY_NOTICES.md')) {
            if(!(Test-Path -LiteralPath (Join-Path $base $license) -PathType Leaf)) { throw 'THIRD_PARTY_NOTICE_MISSING' }
          }
          if((Get-Content (Join-Path $base 'manifest.json') -Raw | ConvertFrom-Json).version -ne '0.1.9') { throw 'ZIP_VERSION_MISMATCH' }
          Write-Output "PUBLISHED_V019_ZIP_1010_FILES_INDEPENDENT_SHA256_PASS=$hash"
      - name: Clean-install and uninstall exact beta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'beta\SOL-Commander-Setup-v0.1.9.exe'
          $root = Join-Path $env:RUNNER_TEMP 'SOL Commander beta clean install'
          $t = Start-Process $setup -ArgumentList '--self-test' -Wait -PassThru
          if ($t.ExitCode -ne 0) { throw "SELF_TEST_FAILED=$($t.ExitCode)" }
          $i = Start-Process $setup -ArgumentList @('--quiet','--acceptance','--install-root',('"' + $root + '"')) -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "BETA_INSTALL_FAILED=$($i.ExitCode)" }
          if (!(Test-Path (Join-Path $root 'app\0.1.9\agent\dist\main.js'))) { throw 'BETA_AGENT_MISSING' }
          if (!(Test-Path (Join-Path $root 'app\0.1.9\runtime\node.exe'))) { throw 'BETA_RUNTIME_MISSING' }
          $runtime = Get-Content (Join-Path $root 'runtime.json') -Raw | ConvertFrom-Json
          if ($runtime.version -ne '0.1.9') { throw 'BETA_VERSION_MISMATCH' }
          $u = Start-Process $setup -ArgumentList @('--uninstall','--quiet','--acceptance','--install-root',('"' + $root + '"')) -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "BETA_UNINSTALL_FAILED=$($u.ExitCode)" }
          if (Test-Path (Join-Path $root 'app')) { throw 'BETA_RUNTIME_NOT_REMOVED' }
          Write-Output 'CLEAN_BETA_INSTALL_UNINSTALL_PASS'
      - name: Upgrade from stable preserving local user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'SOL Commander beta upgrade'
          $stable = Join-Path $PWD 'stable\SOL-Commander-Setup-v0.1.6.exe'
          $beta = Join-Path $PWD 'beta\SOL-Commander-Setup-v0.1.9.exe'
          $args = @('--quiet','--acceptance','--install-root',('"' + $root + '"'))
          $i = Start-Process $stable -ArgumentList $args -Wait -PassThru
          if ($i.ExitCode -ne 0) { throw "STABLE_INSTALL_FAILED=$($i.ExitCode)" }
          $data = Join-Path $root 'data'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $fixture = Join-Path $data 'preserve-fixture.txt'
          [IO.File]::WriteAllText($fixture,'SYNTHETIC-DATA-ONLY')
          $u = Start-Process $beta -ArgumentList $args -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "BETA_UPGRADE_FAILED=$($u.ExitCode)" }
          $runtime = Get-Content (Join-Path $root 'runtime.json') -Raw | ConvertFrom-Json
          if ($runtime.version -ne '0.1.9') { throw 'UPGRADE_NOT_ACTIVE' }
          if ((Get-Content $fixture -Raw) -ne 'SYNTHETIC-DATA-ONLY') { throw 'USER_DATA_CHANGED' }
          $remove = Start-Process $beta -ArgumentList @('--uninstall','--quiet','--acceptance','--install-root',('"' + $root + '"')) -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "UPGRADE_UNINSTALL_FAILED=$($remove.ExitCode)" }
          if (!(Test-Path $fixture)) { throw 'UNINSTALL_DELETED_DATA' }
          if (Test-Path (Join-Path $root 'app')) { throw 'UNINSTALL_LEFT_RUNTIME' }
          Write-Output 'BETA_UPGRADE_AND_USER_DATA_PRESERVATION_PASS'
      - name: Clarify test scope
        shell: pwsh
        run: |
          Write-Output 'Tested the pinned beta EXE on disposable Windows, not the owner PC.'
          Write-Output 'Not a certificate, auto-update, 57 tools, OAuth or OpenAI publication validation.'

